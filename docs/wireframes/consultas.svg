6" fill="#253747">2 | Veiculo Demo Arthur | TPA1N26 | 2024 | 15000 | 2 | Fabricante Demo Arthur 1210</text><text x="260" y="885" font-size="16" fill="#253747">Consultas: fabricante, categoria, cliente, veículo, período, status e fabricantes com/sem veículos.</text><text x="260" y="925" font-size="16" fill="#253747">Parâmetros variam conforme a seleção. Estado vazio e erros são apresentados na mesma tela.</text></g></svg>